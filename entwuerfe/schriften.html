<title>Halbwert Schriftwahl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible+Next:wght@300;400;600&display=swap">
<style>
/* Ein Telefon in der Mitte, oben drei Schalter für die Entwürfe; nur dunkel wie die App selbst */
:root{
  --bg:#101A2C; --card:#172338; --edge:#24344F; --tx:#EFE6DA; --mu:#8D97AC; --ac:#E6C9A0;
  --f-ui:"Atkinson Hyperlegible Next",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-weight:600;font-size:22px;text-wrap:balance}
p{margin:0;color:var(--mu);max-width:65ch}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;color:var(--tx);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tabs button[aria-selected="true"]{border-color:var(--ac);background:#1B2A44}
.tabs button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs .nm{font-size:22px;line-height:1.1}
.tabs small{color:var(--mu);font-size:12px;overflow-wrap:anywhere}
.why{background:var(--card);border-radius:14px;padding:12px 14px;color:var(--tx)}
.phone{align-self:center;width:min(390px,100%);height:760px;border:1px solid var(--edge);border-radius:28px;overflow:hidden;background:var(--bg)}
.phone iframe{width:100%;height:100%;border:0;display:block}
a{color:var(--ac)}
</style>
<main>
  <h1>Drei Schriften für Halbwert</h1>
  <p>Gleiche App, gleiche Farben, nur die Schriften sind anders. Die Einträge sind Beispiele. Du kannst in jedem Entwurf tippen und die Ansicht wechseln.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-a" aria-selected="true" data-f="schrift-a-cockpit.html" data-why="B612 wurde für Airbus-Cockpitanzeigen entwickelt: klare, offene Ziffern, die auf einem Messinstrument sofort lesbar sind. Passt zum Tacho. Wirkt technisch und sachlich."><span class="nm" style="font-family:'B612',sans-serif;font-weight:700">A</span><b>Cockpit</b><small>B612</small></button>
    <button role="tab" id="t-b" aria-selected="false" data-f="schrift-b-kaffeetuete.html" data-why="Bricolage Grotesque ist kräftig und hat Ecken und Kanten, wie der Aufdruck auf einer Röster-Kaffeetüte. Die großen Zahlen bekommen viel Gewicht. Wirkt am meisten nach eigener Marke."><span class="nm" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800">B</span><b>Kaffeetüte</b><small>Bricolage Grotesque</small></button>
    <button role="tab" id="t-c" aria-selected="false" data-f="schrift-c-nachtruhe.html" data-why="Atkinson Hyperlegible wurde vom Braille Institute für maximale Lesbarkeit gebaut: 0 und O, 1 und l sind klar zu unterscheiden. Auch spät abends halb verschlafen gut zu lesen. Wirkt leicht und ruhig."><span class="nm" style="font-family:'Atkinson Hyperlegible Next',sans-serif;font-weight:300">C</span><b>Nachtruhe</b><small>Atkinson Hyperlegible</small></button>
  </div>
  <div class="why" id="why"></div>
  <div class="phone"><iframe id="fr" title="Entwurf" src="schrift-a-cockpit.html"></iframe></div>
  <p>Klappt die Vorschau nicht? <a id="open" href="schrift-a-cockpit.html" target="_blank" rel="noopener">Entwurf ganzseitig öffnen</a></p>
</main>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')],fr=document.getElementById('fr'),why=document.getElementById('why'),op=document.getElementById('open');
function pick(b){tabs.forEach(t=>t.setAttribute('aria-selected',t===b));fr.src=b.dataset.f;op.href=b.dataset.f;why.textContent=b.dataset.why;
  try{localStorage.setItem('schrift',b.id)}catch(e){}}
tabs.forEach(b=>b.addEventListener('click',()=>pick(b)));
let start=tabs[0];try{start=document.getElementById(localStorage.getItem('schrift'))||start}catch(e){}
pick(start);
</script>
