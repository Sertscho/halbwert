<title>Halbwert App-Symbol</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: drei Symbol-Karten, jeweils groß und in Home-Bildschirm-Größe. Bewusst nur dunkel. */
:root{color-scheme:dark;--bg:#0B1322;--card:#101A2C;--tx:#EFE6DA;--mu:#8D97AC;--ac:#E6C9A0;--f-d:"Instrument Serif",Georgia,serif;--f-u:"IBM Plex Sans",system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);font-family:var(--f-u);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
main{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--f-d);font-weight:400;font-size:clamp(32px,6vw,48px);margin:0}
h1 i{color:var(--ac)}
p{margin:0;color:var(--mu);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid #24344F;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.big svg{width:100%;max-width:280px;height:auto;display:block;margin:0 auto;border-radius:22.5%}
.home{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:linear-gradient(160deg,#2B3E63,#5A3B2A)}
.tile svg{width:64px;height:64px;display:block;border-radius:22.5%;box-shadow:0 4px 10px #0006}
.home span{font-size:12px;color:#fff}
figcaption{display:flex;flex-direction:column;gap:4px}
figcaption b{font-size:17px}
figcaption span{font-size:14px;color:var(--mu)}
</style>
